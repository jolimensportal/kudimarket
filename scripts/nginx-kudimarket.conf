# KudiMarket -- nginx site, serving through Cloudflare's proxy.
#
# 1. real_ip_* -- behind the proxy every request arrives from a Cloudflare edge, so without these
#    lines $remote_addr is Cloudflare's address and every access log and audit record reads "a
#    Cloudflare server did this". Ranges come from https://www.cloudflare.com/ips-v4 at deploy time;
#    Cloudflare changes them and a stale list silently reverts you to logging the proxy.
#
# 2. The certificate is a CLOUDFLARE ORIGIN certificate, not a public one. Trusted by Cloudflare and
#    nothing else, which is right: the browser never sees it, and it never enters a public
#    certificate-transparency log.
#
# There is deliberately no port 80 server block. With Full (strict) Cloudflare speaks HTTPS to us,
# and a plain-HTTP listener would only be a downgrade waiting to happen.

set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name kudimarket.com www.kudimarket.com;

    ssl_certificate     /etc/kudi-tls/origin.pem;
    ssl_certificate_key /etc/kudi-tls/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /srv/kudimarket/app/public;
    index index.php;
    charset utf-8;
    client_max_body_size 12M;

    access_log /var/log/nginx/kudimarket.access.log;
    error_log  /var/log/nginx/kudimarket.error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param HTTP_PROXY "";
    }

    # Never serve a dotfile. A stray .env served as text is the whole secret of the deployment.
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Static assets get a long cache ONLY when they really are on disk. Anything that is not falls
    # through to Laravel instead of 404-ing here, and that is not a detail.
    #
    # Filament's operations console is Livewire, and Livewire serves livewire.min.js through a ROUTE
    # (/livewire-<hash>/livewire.min.js), not as a file on disk. A "try_files $uri =404" on .js
    # therefore swallows the entire console: the request never reaches PHP, the panel renders with no
    # JavaScript, and signing in silently does nothing. It presents as a broken login form. It is a
    # broken nginx location, and it stays invisible until somebody actually uses the console.
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        access_log off;
        try_files $uri @laravel;
    }

    location @laravel {
        try_files $uri $uri/ /index.php?$query_string;
    }
}
